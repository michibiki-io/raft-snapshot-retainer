name: Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ vars.ACTIONS_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Format, vet, unit and race
        run: make check test
      - name: Cross-compile release binaries
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /tmp/retainer-$arch ./cmd/raft-snapshot-retainer
          done
      - name: Install integration test dependencies
        run: |
          python3 -m venv .tmp/e2e-venv
          .tmp/e2e-venv/bin/pip install -r test/e2e/requirements.txt
      - name: Validate release helpers and harness
        run: |
          python3 -m py_compile scripts/release/*.py test/e2e/scripts/*.py test/e2e/pytest/*.py
          .tmp/e2e-venv/bin/python -m unittest discover -s scripts/release -p 'test_*.py'
      - uses: docker/setup-buildx-action@v4
      - name: Validate amd64 container with GHA build cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: raft-snapshot-retainer:e2e
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: MinIO CLI integration
        run: .tmp/e2e-venv/bin/python test/e2e/scripts/run.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test/e2e/results/
          if-no-files-found: ignore
