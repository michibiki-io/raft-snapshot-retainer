name: Release

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: >-
      ${{ github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'main'
      && startsWith(github.event.pull_request.head.ref, 'feature/') }}
    outputs:
      release_required: ${{ steps.compute.outputs.release_required }}
      release_kind: ${{ steps.compute.outputs.release_kind }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      git_tag: ${{ steps.compute.outputs.git_tag }}
      docker_tag: ${{ steps.compute.outputs.docker_tag }}
      tag_exists: ${{ steps.compute.outputs.tag_exists }}
      image: ${{ steps.image.outputs.image }}
    env:
      RELEASE_BRANCH: main
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Fetch PR head for git fallback
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --force origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          git fetch --force origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"

      - name: Compute release metadata
        id: compute
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}  # diagnostics only; release classification ignores PR titles
        run: python3 scripts/release/compute_release.py

      - name: Skip when no release is required
        if: steps.compute.outputs.release_required != 'true'
        run: echo "No releasable commit messages were found for this merged pull request."
      - name: Normalize image name
        if: steps.compute.outputs.release_required == 'true'
        id: image
        shell: bash
        run: |
          lower_repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_REGISTRY}/${lower_repository}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and verify Linux ${{ matrix.arch }} release artifacts
    needs: prepare
    if: needs.prepare.outputs.release_required == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
          - arch: arm64
            machine: aarch64
            runner: ${{ vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.git_tag }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Verify native Linux runner and Docker daemon
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          uname -sm
          test "$(uname -sm)" = "Linux $MACHINE"
          test "$(docker info --format '{{.OSType}} {{.Architecture}}')" = "linux $MACHINE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run Go tests
        run: go test ./...

      - name: Build and verify native release archive
        run: |
          GOOS=linux GOARCH="$ARCH" make build VERSION="$VERSION"
          archive="dist/raft-snapshot-retainer_${VERSION}_linux_${ARCH}.tar.gz"
          tar -czf "$archive" -C dist raft-snapshot-retainer
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "$archive" -C "$extracted" raft-snapshot-retainer
          python3 scripts/release/verify_elf.py "$ARCH" "$extracted/raft-snapshot-retainer"
          actual=$("$extracted/raft-snapshot-retainer" --version)
          test "$actual" = "$VERSION"

      - name: Upload verified release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - name: Derive Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.docker_tag }}

      - name: Build and push native Docker image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.VERSION }}
          # This post-merge event has read-only cache access; cold builds are valid.
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Verify pushed image by child digest
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          child=$(docker buildx imagetools inspect --raw "$IMAGE@$INDEX_DIGEST" |
            jq -er --arg arch "$ARCH" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected exactly one Linux " + $arch + " image") end
              | select(test("^sha256:[a-f0-9]{64}$"))
            ')
          docker pull --platform "linux/$ARCH" "$IMAGE@$child"
          bash scripts/release/verify_image.sh "$ARCH" "$IMAGE@$child" "$VERSION"
          # Carry forward the index rather than its child to preserve attestations.
          printf '%s\n' "$INDEX_DIGEST" > "$ARCH.digest"

      - name: Upload verified image index digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.digest
          if-no-files-found: error

  docker-manifest:
    name: Publish Docker manifest
    needs: [prepare, build]
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: needs.prepare.outputs.release_required == 'true'
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.docker_tag }}
      VERSION: ${{ needs.prepare.outputs.git_tag }}
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Check out merge commit for tagging
        if: needs.prepare.outputs.tag_exists != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Download verified image index digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Create annotated git tag
        if: needs.prepare.outputs.tag_exists != 'true'
        run: |
          git fetch --tags origin
          if existing=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}"); then
            test "$existing" = "$(git rev-parse HEAD)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - name: Create final multi-arch Docker tag
        run: |
          amd64=$(cat digests/amd64.digest)
          arm64=$(cat digests/arm64.digest)
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE@$amd64" "$IMAGE@$arm64"

  publish:
    name: Publish release
    needs: [prepare, build, docker-manifest]
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: needs.prepare.outputs.release_required == 'true'
    env:
      RELEASE_BRANCH: main
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mkdir -p .github/tmp &&
          python3 scripts/release/generate_release_notes.py
          --repo "${GITHUB_REPOSITORY}"
          --previous-tag "${{ needs.prepare.outputs.previous_tag }}"
          --target "${{ github.event.pull_request.merge_commit_sha }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --output .github/tmp/release-notes.md

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: dist/
      - name: Write release archive checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.git_tag }}
        run: |
          sha256sum "raft-snapshot-retainer_${VERSION}_linux_amd64.tar.gz" \
            "raft-snapshot-retainer_${VERSION}_linux_arm64.tar.gz" > SHA256SUMS
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate manifest inspection
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ env.IMAGE_REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      - name: Record published image manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.docker_tag }}
          VERSION: ${{ needs.prepare.outputs.git_tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: python3 scripts/release/image_manifest.py

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.git_tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: .github/tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-images.json
            dist/approved-runtime-images.json
