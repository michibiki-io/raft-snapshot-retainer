services:
  s3:
    build:
      context: .
      dockerfile: Dockerfile.minio
    platform: linux/amd64
    command: server /data
    environment:
      MINIO_ROOT_USER: ${E2E_ACCESS_KEY:?generated by runner}
      MINIO_ROOT_PASSWORD: ${E2E_SECRET_KEY:?generated by runner}
    ports:
      - "127.0.0.1:${E2E_PORT:-0}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 60
